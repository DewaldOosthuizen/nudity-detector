name: PR Gate
#
# Single quality gate for pull requests targeting `main`.
#
# Model: agile-tools/tech-cheat-sheets-and-notes' pr_gate.yml (markdownlint ->
# python-lint -> mermaid-check -> python-test chained, npm-audit parallel,
# pr-gate-summary needs:[all] + if:always()). This repo has no markdown/mermaid
# content pipeline, so the equivalent chain here is:
#
#   lint (ruff check) -> test (pytest --cov)      [sequential: don't waste CI
#                                                   minutes running tests
#                                                   against code that doesn't
#                                                   even pass lint]
#   pip-audit                                      [independent, runs in
#                                                   parallel with lint/test —
#                                                   dependency vulnerabilities
#                                                   are orthogonal to whether
#                                                   this PR's code lints/passes]
#   pr-gate-summary (needs: all three, if: always())
#                                                   [single required status
#                                                   check for branch
#                                                   protection; fails loudly
#                                                   and clearly if ANY upstream
#                                                   job failed, cancelled, or
#                                                   was skipped]
#
# This mirrors the reference repo's "stop on failure with clear reporting"
# pattern verbatim in the summary job.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.16.0"

      - name: Run ruff
        run: ruff check src/ tests/

  test:
    name: Tests (pytest --cov)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing tests/

  pip-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  pr-gate-summary:
    name: PR Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, test, pip-audit]
    if: always()
    steps:
      - name: Check gate results
        run: |
          echo "lint:      ${{ needs.lint.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "pip-audit: ${{ needs.pip-audit.result }}"

          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.pip-audit.result }}" != "success" ]]; then
            echo "::error::One or more PR gate jobs did not succeed."
            exit 1
          fi

          echo "All PR gate jobs passed."
